<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>简单全局代理</title>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 {
      margin: 0 0 15px 0;
      font-size: 18px;
      font-weight: 600;
      color: #222;
    }

    button {
      margin: 5px 0;
      padding: 8px 16px;
      background: linear-gradient(135deg, #4a90e2, #357ABD);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: auto;
      min-width: 120px;
      transition: background 0.3s ease, transform 0.1s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #5aa3ff, #3c84d8);
    }

    button:active {
      transform: scale(0.97);
    }

    #currentProxy {
      margin-top: 15px;
      padding: 10px;
      background-color: #fff;
      border-left: 4px solid #4a90e2;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      width: 100%;
      word-wrap: break-word;
    }

    .no-proxy {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <img src="icons/logo.png" style="width:50px"/>
  <h3>简单全局代理</h3>
  <button id="settingsBtn">⚙️ 代理设置</button>
  <div id="currentProxy" class="no-proxy">当前未设置代理</div>

  <script src="popup.js"></script>
</body>
</html>
