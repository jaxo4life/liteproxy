<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>LiteProxy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="status-bar" id="statusBar"></div>
    <div class="popup">
      <header class="top">
        <div class="brand">
          <img src="/public/icons/icon48.png" alt="LiteProxy" class="logo" />
          <span class="name">LiteProxy</span>
        </div>
        <span id="version" class="ver"></span>
      </header>

      <div class="state" id="stateLine">
        <span class="dot" id="stateDot"></span>
        <span id="stateText">未启用</span>
      </div>

      <div id="proxyCard" class="proxy-card empty"></div>

      <button id="toggleButton" class="toggle">启用代理</button>
      <button id="settingsBtn" class="link">代理设置 →</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
