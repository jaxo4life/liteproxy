<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>代理设置</title>
  <style>
    body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
    input, select, textarea { margin: 5px 0; width: 100%; padding: 5px; }
    button { margin: 5px 0; width: 100%; padding: 5px; }
    .bypass-section { margin-top: 15px; }
    textarea { height: 100px; resize: vertical; }
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
      padding: 5px;
      background: #f5f5f5;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h3>设置代理</h3>
  <select id="proxyScheme">
    <option value="http">HTTP</option>
    <option value="socks5">SOCKS5</option>
  </select>
  <input type="text" id="proxyHost" placeholder="代理服务器地址">
  <input type="number" id="proxyPort" placeholder="端口">
  
  <div class="bypass-section">
    <h3>绕过代理的地址</h3>
    <textarea id="bypassList" placeholder="输入不使用代理的地址，每行一个"></textarea>
    <div class="help-text">常用示例：
      localhost
      127.0.0.1
      *.local
      [::1]
      *.example.com
    </div>
    <div class="help-text" style="margin-top: 10px;">
      支持的格式：
      <ul style="margin: 5px 0; padding-left: 20px;">
        <li>域名: example.com</li>
        <li>通配符: *.example.com</li>
        <li>IP地址: 192.168.1.1</li>
        <li>IP地址段: 192.168.1.1/24</li>
        <li>带端口: example.com:8080</li>
        <li>指定协议: http://example.com</li>
      </ul>
    </div>
  </div>

  <button id="setProxy">设置代理</button>
  <button id="clearProxy">清除代理</button>
  <script src="settings.js"></script>
</body>
</html>
