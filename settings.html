<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>代理设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="container">
      <h3>🌐 设置代理</h3>
      <select id="proxyScheme">
        <option value="http">HTTP</option>
        <option value="socks5">SOCKS5</option>
      </select>
      <input type="text" id="proxyHost" placeholder="代理服务器地址" />
      <input type="number" id="proxyPort" placeholder="端口" />

      <div class="bypass-section">
        <h3>⛔ 绕过代理的地址</h3>
        <label for="presetSelect">绕过预设选择：</label>
        <select id="presetSelect" style="margin-bottom: 10px">
          <option value="">-- 请选择预设规则 --</option>
        </select>

        <textarea
          id="bypassList"
          placeholder="输入不使用代理的地址，每行一个"
        ></textarea>
        <div class="help-text">
          常用示例：
          <br />localhost <br />127.0.0.1 <br />*.local <br />[::1]
          <br />*.example.com
        </div>
        <div class="help-text" style="margin-top: 10px">
          支持的格式：
          <ul>
            <li>域名: example.com</li>
            <li>通配符: *.example.com</li>
            <li>IP地址: 192.168.1.1</li>
            <li>IP地址段: 192.168.1.1/24</li>
            <li>带端口: example.com:8080</li>
            <li>指定协议: http://example.com</li>
          </ul>
        </div>
      </div>

      <div class="btn-group">
        <button id="setProxy">💾 设置</button>
        <button id="clearProxy">🗑 清除</button>
      </div>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
